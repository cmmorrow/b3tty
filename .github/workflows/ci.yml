name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        run: cd src/client && bun install

      - name: Run tests
        run: make test

  test-race:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # src/dist is gitignored (generated build output) and go:embed requires
      # it to exist at compile time, so `make test-race` (via its `client`
      # prerequisite) needs the client toolchain even though this job doesn't
      # otherwise touch the client bundle.
      - name: Install client dependencies
        run: cd src/client && bun install

      - name: Run tests with race detector
        run: make test-race

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        run: cd src/client && bun install

      - name: Check formatting
        run: make format-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        run: cd src/client && bun install

      - name: Type check
        run: make lint
